services:
  - type: web
    name: site-ensinar-c-real
    env: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      # Endereço do PostgreSQL (Neon ou outro). Preencha no painel do Render; nunca no Git.
      - key: DATABASE_URL
        sync: false
      # E-mails dos professores (separados por vírgula) que acessam /professor.
      - key: ADMIN_EMAILS
        sync: false
      - key: COMPILER_BACKEND
        value: local
      - key: COMPILER_RUNNER_USER
        value: compiler-runner
      - key: MAX_COMPILER_JOBS
        value: "1"
      - key: MAX_INTERACTIVE_PROGRAMS
        value: "4"
      - key: COMPILER_MAX_PROCESSES
        value: "8"
      - key: COMPILER_QUEUE_TIMEOUT
        value: "5"
      - key: COMPILER_RESOURCE_RETRIES
        value: "2"
      - key: COMPILER_COMPILE_TIMEOUT
        value: "30"
      - key: COMPILER_COMPILE_CPU
        value: "12"
      - key: COMPILER_RUN_TIMEOUT
        value: "8"
      - key: COMPILER_INTERACTIVE_TIMEOUT
        value: "120"
