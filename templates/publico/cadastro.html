{% extends "layout/base.html" %}
{% block title %}Cadastro - Ensinar C{% endblock %}

{% block content %}
<section class="auth-page">
    <form class="auth-card" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <a class="brand auth-brand" href="/">
            <span class="brand-icon">C</span>
            <strong>Ensinar C</strong>
        </a>

        <h1>Criar conta</h1>
        <p>Use um e-mail único para salvar seu progresso, XP e códigos.</p>

        {% if erro %}<div class="alert" role="alert">{{ erro }}</div>{% endif %}

        <label for="nome">Nome</label>
        <input id="nome" type="text" name="nome" value="{{ nome or '' }}" maxlength="60" autocomplete="name" required>

        <label for="email">E-mail</label>
        <input id="email" type="email" name="email" value="{{ email or '' }}" maxlength="120" autocomplete="email" required>

        <label for="senha">Senha <span class="small-muted">(mínimo de 8 caracteres)</span></label>
        <input id="senha" type="password" name="senha" minlength="8" maxlength="128" autocomplete="new-password" required>

        <label for="confirmar_senha">Confirme a senha</label>
        <input id="confirmar_senha" type="password" name="confirmar_senha" minlength="8" maxlength="128" autocomplete="new-password" required>

        <label class="auth-check"><input type="checkbox" data-mostrar-senha> Mostrar senha</label>

        <button class="btn btn-primary" type="submit">Começar agora</button>

        <p class="auth-link">Já tem conta? <a href="/login">Entrar</a></p>
    </form>
</section>
{% endblock %}
