{% extends "layout/base.html" %}

{% block title %}Erro - Ensinar C{% endblock %}

{% block content %}
<div class="error-page">
<div class="topbar">
    <div>
        <h1>Algo deu errado</h1>
        <p>{{ mensagem }}</p>
        {% if codigo_erro %}<p class="small-muted">Código do erro: <strong>{{ codigo_erro }}</strong>. Se continuar, informe este código ao professor.</p>{% endif %}
    </div>
</div>
<section class="card">
    <a class="btn btn-primary" href="/">Voltar ao início</a>
</section>
</div>
{% endblock %}
