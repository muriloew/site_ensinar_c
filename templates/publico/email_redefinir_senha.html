<!DOCTYPE html>
<html lang="pt-BR">
<body style="font-family: Arial, Helvetica, sans-serif; color: #0f172a;">
    <p>Olá, {{ nome }}.</p>
    <p>Para criar uma senha nova no Ensinar C, clique no botão abaixo. O link vale por 1 hora e só pode ser usado uma vez.</p>
    <p><a href="{{ link }}" style="display: inline-block; padding: 12px 18px; background: #1d8cff; color: #ffffff; border-radius: 8px; text-decoration: none;">Criar senha nova</a></p>
    <p>Se o botão não funcionar, copie este endereço no navegador:<br>{{ link }}</p>
    <p>Se você não pediu, ignore este e-mail; sua senha continua a mesma.</p>
</body>
</html>
